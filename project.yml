name: MediaHelper
options:
  bundleIdPrefix: com.levi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  MediaHelper:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MediaHelper
        excludes:
          - "Info.plist"
    info:
      path: MediaHelper/Info.plist
      properties:
        CFBundleDisplayName: Media Helper
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.video
        NSHumanReadableCopyright: ""
        NSDownloadsFolderUsageDescription: "Media Helper saves the audio and video files you ask for in your Downloads folder."
        NSDesktopFolderUsageDescription: "Media Helper can save the audio and video files you ask for on your Desktop."
        NSDocumentsFolderUsageDescription: "Media Helper can save the audio and video files you ask for in your Documents folder."
        # Updates: "owner/repo" of the public GitHub repository, and the Ed25519 PUBLIC key
        # (base64) that update downloads must be signed with. Filled in by scripts/setup-updates.sh.
        MediaHelperUpdateRepo: ""
        MediaHelperUpdatePublicKey: ""
    settings:
      base:
        PRODUCT_NAME: Media Helper
        PRODUCT_BUNDLE_IDENTIFIER: com.levi.mediahelper
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
